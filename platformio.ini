; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu]
platform = https://github.com/freedib/platform-espressif8266
board = nodemcuv2
framework = esp8266-rtos-sdk
build_type = debug

monitor_speed = 921600
upload_speed = 921600
monitor_filters = esp32_exception_decoder, direct
build_flags = -DCREED

; how to install this toolchain
; 1) download the xtensa toolchain from https://docs.espressif.com/projects/esp8266-rtos-sdk/en/latest/get-started/windows-setup.html
; 	version 8.4.0 and extract it to .platformio/packages/toolchain-xtensa@8.4.0
; 2) add .piopm and package.json files as below
;	.piopm:  {"type": "tool", "name": "toolchain-xtensa", "version": "8.4.0", "spec": {"owner": "platformio", "id": 8221, "name": "toolchain-xtensa", "requirements": null, "uri": null}}
; 	package.json: {"name": "toolchain-xtensa", "version": "8.4.0", "description": "GCC Toolchain for Xtensa processor", "keywords": ["build tools", "compiler", "assembler", "linker", "preprocessor", "esp8266"], "license": "GPL-2.0-or-later", "repository": {"type": "git", "url": "https://github.com/earlephilhower/esp-quick-toolchain"}, "system": ["windows_amd64", "windows_arm64"]}
; 3) git clone --recursive https://github.com/freedib/framework-esp8266-rtos-sdk and change the folder name to include @3.4.0
;	.piopm: {"type": "tool", "name": "framework-esp8266-rtos-sdk", "version": "3.4.0", "spec": {"owner": "platformio", "id": 8071, "name": "framework-esp8266-rtos-sdk", "requirements": null, "uri": null}}
;   package.json: keep from giot 
; 4) copy a .piopm file from another framework rtos sdk package and change the version to 3.4
; 5) git clone --recursive https://github.com/freedib/tool-genbin-esp8266
; 6) add .piopm file 
;	{"type": "tool", "name": "tool-genbin-esp8266", "version": "1.0.0", "spec": {"owner": "platformio", "id": 11005, "name": "tool-genbin-esp8266", "requirements": null, "uri": null}}	

